# .github/workflows/fourcc.yml
# Reads FigXPCCreateBasicMessage from the Xcode SDK's CoreMedia binary
# and dumps the fourcc loaded into x0. No IPSW download needed.
# Run manually: Actions -> "Probe fourcc" -> Run workflow.

name: Probe fourcc
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Find SDK CoreMedia
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version

          echo ""
          echo "=== CoreMedia candidates ==="
          find /Applications/Xcode*.app \
            -name "CoreMedia" \
            -not -name "*.h" \
            -not -path "*/Headers/*" \
            2>/dev/null | head -10

          # Pick the iphoneos one
          CM=$(find /Applications/Xcode*.app \
            -name "CoreMedia" \
            -path "*/iphoneos*" \
            -not -name "*.h" \
            -not -path "*/Headers/*" \
            2>/dev/null | head -1)

          if [ -z "$CM" ]; then
            echo "iphoneos path not found, trying any SDK path..."
            CM=$(find /Applications/Xcode*.app \
              -name "CoreMedia" \
              -not -name "*.h" \
              -not -path "*/Headers/*" \
              2>/dev/null | head -1)
          fi

          echo ""
          echo "Using: $CM"
          cp "$CM" ./CoreMedia
          ls -lh CoreMedia
          file CoreMedia

      - name: Dump FigXPCCreateBasicMessage
        run: |
          echo "=== architectures ==="
          lipo -info CoreMedia 2>/dev/null || file CoreMedia

          echo ""
          echo "=== nm — FigXPCCreateBasicMessage ==="
          nm -arch arm64 CoreMedia 2>/dev/null | grep -i FigXPCCreate || \
          nm CoreMedia 2>/dev/null | grep -i FigXPCCreate || true

          echo ""
          echo "=== first 60 instructions of FigXPCCreateBasicMessage ==="
          otool -arch arm64 -tV CoreMedia 2>/dev/null | \
            awk '/FigXPCCreateBasicMessage/{f=1;n=0} f{print;n++; if(n>=60)exit}' || true

          echo ""
          echo "=== movz/movk x0 lines (the fourcc) ==="
          otool -arch arm64 -tV CoreMedia 2>/dev/null | \
            awk '/FigXPCCreateBasicMessage/{f=1;n=0} f{n++; if(n>=60)exit; if(/movz|movk/)print}' || true

      - name: Upload CoreMedia
        uses: actions/upload-artifact@v4
        with:
          name: CoreMedia-SDK
          path: CoreMedia
          if-no-files-found: warn
